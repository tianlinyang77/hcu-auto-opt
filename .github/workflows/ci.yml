name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest tests/unit -v

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dcuopt
          POSTGRES_PASSWORD: dcuopt
          POSTGRES_DB: dcuopt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dcuopt -d dcuopt"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DCUOPT_DATABASE_URL: postgresql://dcuopt:dcuopt@localhost:5432/dcuopt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/integration -m postgres -v

