name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:sites

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest tests/unit -v

  unit-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pytest tests/unit/test_stage0_protocol.py tests/unit/test_stage0_statistics.py
          tests/unit/test_stage0_verifier.py tests/unit/test_m1_measurement.py
          tests/unit/test_m1_d_verifier.py tests/unit/test_m2a_formal_readiness.py
          tests/unit/test_m2_formal_execution.py
          tests/unit/test_m2_business_candidate_family.py
          tests/unit/test_m2a_business_candidate_family_verification.py -v

  scripted-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pytest tests/integration/test_sglang_smoke_scripted.py
          tests/integration/test_m1_d_scripted.py -v
      - if: runner.os == 'Linux'
        run: pytest tests/integration/test_m1_c_scripted.py -v

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hcuopt
          POSTGRES_PASSWORD: hcuopt
          POSTGRES_DB: hcuopt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcuopt -d hcuopt"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      HCUOPT_DATABASE_URL: postgresql://hcuopt:hcuopt@localhost:5432/hcuopt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/integration -m postgres -v
      - name: Run PostgreSQL-backed Walking Skeleton
        run: |
          hcuopt api --host 127.0.0.1 --port 8000 > /tmp/hcuopt-api.log 2>&1 &
          api_pid=$!
          trap 'cat /tmp/hcuopt-api.log; kill $api_pid 2>/dev/null || true' EXIT
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/healthz
          hcuopt walking-demo --api-url http://127.0.0.1:8000 --timeout 60
