[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dcu-auto-opt"
version = "0.2.0"
description = "Trustworthy automated optimization control plane for DCU inference workloads"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DCU Auto Opt contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
dcuopt = "dcuopt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dcuopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a real PostgreSQL database"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
