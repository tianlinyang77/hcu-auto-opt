[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dcu-auto-opt"
version = "0.1.0"
description = "Trustworthy automated optimization control plane for DCU inference workloads"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DCU Auto Opt contributors"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "psycopg[binary]>=3.2",
  "ruff>=0.9",
]

[project.scripts]
dcuopt = "dcuopt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dcuopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a real PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
