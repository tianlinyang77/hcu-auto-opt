[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hcu-auto-opt"
version = "0.2.0"
description = "Trustworthy automated optimization control plane for HCU inference workloads"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "HCU Auto Opt contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
hcuopt = "hcuopt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hcuopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "postgres: requires a real PostgreSQL database",
  "target_lock: requires the locked nmz36 hardware, image, and source checkout",
]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["config/m2/*-candidate-store-*/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
