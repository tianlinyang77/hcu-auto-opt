services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dcuopt
      POSTGRES_PASSWORD: dcuopt
      POSTGRES_DB: dcuopt
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcuopt -d dcuopt"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - dcuopt-postgres:/var/lib/postgresql/data

volumes:
  dcuopt-postgres:

