services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hcuopt
      POSTGRES_PASSWORD: hcuopt
      POSTGRES_DB: hcuopt
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcuopt -d hcuopt"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - hcuopt-postgres:/var/lib/postgresql/data

  api:
    build: .
    environment:
      HCUOPT_DATABASE_URL: postgresql://hcuopt:hcuopt@postgres:5432/hcuopt
      HCUOPT_AUTO_MIGRATE: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"
      interval: 2s
      timeout: 3s
      retries: 30

  agent-worker:
    build: .
    command: ["hcuopt", "worker", "--id", "agent-1", "--type", "agent", "--api-url", "http://api:8000"]
    depends_on:
      api:
        condition: service_healthy

  build-worker:
    build: .
    command: ["hcuopt", "worker", "--id", "build-1", "--type", "build", "--api-url", "http://api:8000"]
    depends_on:
      api:
        condition: service_healthy

  gpu-worker:
    build: .
    command:
      ["hcuopt", "worker", "--id", "gpu-1", "--type", "gpu", "--resource-id", "fake-hcu-0", "--api-url", "http://api:8000"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  hcuopt-postgres:
